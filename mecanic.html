<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AutoAssist - Searching for Mechanic</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Icons -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'ping-slow': 'ping 2s cubic-bezier(0, 0, 0.2, 1) infinite',
                        'ping-slower': 'ping 3s cubic-bezier(0, 0, 0.2, 1) infinite',
                    }
                },
            },
        }
    </script>
<style>/* Custom map background simulation */
.map-bg {
    background-color: #101922;
    background-image: linear-gradient(rgba(16, 25, 34, 0.85), rgba(16, 25, 34, 0.85)), url(https://lh3.googleusercontent.com/aida-public/AB6AXuCb0q-aF71eCbLI-UAYL1InZUo9xQMDT7jKJhYuA7UeAKZxDZFl_qj1bq-3qJBa-Tc6u_37a63lBAGLCO-fBbx_7gIJB2IgU-A6W3jB5_qvipEuWEYoHCnREl6oGbHgYCL5ZDeVPumBxgN3TVFoOr_5x61CU-0TJXBcxi1jshD64hlrgY2ZBF5Vyo_cN20BsRQ_CIErvIxK9RDnpJb2RQ0dyXnZ7pwHkk2Tlw1fKuStrYxS_Sf569c-z6fj9SH-jCAweK7asEgjzIy4);
    background-size: cover;
    background-position: center
    }
/* Radar ripple effect */
.ripple {
    position: absolute;
    border-radius: 50%;
    background-color: rgba(19, 127, 236, 0.1);
    border: 1px solid rgba(19, 127, 236, 0.3);
    animation: ripple-anim 3s linear infinite
    }
.ripple:nth-child(1) {
    animation-delay: 0s
    }
.ripple:nth-child(2) {
    animation-delay: 1s
    }
.ripple:nth-child(3) {
    animation-delay: 2s
    }
@keyframes ripple-anim {
    0% {
        width: 100px;
        height: 100px;
        opacity: 0.8;
        border-width: 1px;
        } 100% {
        width: 600px;
        height: 600px;
        opacity: 0;
        border-width: 0px;
        }
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-white h-screen overflow-hidden relative">
<!-- Map Background Container -->
<div class="absolute inset-0 z-0 map-bg" data-alt="Dark stylized map of city streets at night" data-location="New York City" style=""></div>
<!-- Main Content Wrapper -->
<div class="relative z-10 flex flex-col h-full w-full max-w-md mx-auto">
<!-- Header / Top Bar -->
<div class="pt-12 px-6 flex justify-between items-center w-full">
<button class="bg-white/10 backdrop-blur-md rounded-full p-2 text-white hover:bg-white/20 transition-colors">
<span class="material-icons text-xl">arrow_back</span>
</button>
<div class="bg-primary/20 backdrop-blur-md border border-primary/30 px-4 py-1.5 rounded-full flex items-center gap-2">
<span class="material-icons text-primary text-sm">handyman</span>
<span class="text-xs font-semibold text-primary uppercase tracking-wide">Emergency Request</span>
</div>
<button class="bg-white/10 backdrop-blur-md rounded-full p-2 text-white hover:bg-white/20 transition-colors">
<span class="material-icons text-xl">help_outline</span>
</button>
</div>
<!-- Center: Radar / Searching Animation -->
<div class="flex-1 flex flex-col items-center justify-center relative">
<!-- Radar Animation Container -->
<div class="relative flex items-center justify-center w-[600px] h-[600px] pointer-events-none">
<div class="ripple"></div>
<div class="ripple"></div>
<div class="ripple"></div>
<!-- Central Avatar/Pin -->
<div class="relative z-20 w-24 h-24 rounded-full bg-background-dark border-4 border-primary shadow-[0_0_30px_rgba(19,127,236,0.5)] flex items-center justify-center overflow-hidden">
<img alt="User Profile Avatar" class="w-full h-full object-cover opacity-90" data-alt="Close up portrait of a smiling man" src="https://lh3.googleusercontent.com/aida-public/AB6AXuASI31TtNYaYS8xXI2gF9CUBVnEOSgtfTrydUxG4SvFcYcYHS2q-kQlYcm6ms1fFd01a_9cyA8-Q4emkuyrDW8cC2-N6auR5pu2IHNCa0mNXoDRs0QlRSJIjIASGUcpKQ0IU-XAh7xxtMun5ZeKjzi-UQotsptBqG65fQVnn8zxyC770ZONMWs34sMfsCDNA4AfVzO5Jq5Kvbtwsmrq2otuG_PhPaf2GJ3EX2CzwXnGhU0I9tZFnYD8GOLXCx0ATfHzu1QaGAOaZUmv"/>
<!-- Pulsing location dot overlay -->
<div class="absolute top-0 right-0 p-1 bg-background-dark rounded-full">
<div class="w-4 h-4 bg-green-500 rounded-full border-2 border-background-dark animate-pulse"></div>
</div>
</div>
</div>
<!-- Status Text -->
<div class="text-center space-y-3 mt-[-100px] z-20 px-6">
<h1 class="text-3xl font-bold text-white leading-tight">Finding nearby<br/>mechanics...</h1>
<p class="text-slate-400 text-sm font-medium">Scanning your area for available experts.</p>
<div class="inline-flex items-center gap-2 px-3 py-1 bg-white/5 rounded-lg border border-white/10 mt-2">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="text-xs text-slate-300">Est. wait time: 1-2 min</span>
</div>
</div>
</div>
<!-- Bottom Sheet / Action Area -->
<div class="px-6 pb-10 pt-4 w-full z-20">
<!-- Service Details Card -->
<div class="bg-background-dark/80 backdrop-blur-xl border border-white/10 rounded-xl p-4 mb-4 shadow-lg">
<div class="flex items-start gap-4">
<div class="bg-primary/20 p-3 rounded-lg">
<span class="material-icons text-primary">tire_repair</span>
</div>
<div class="flex-1">
<h3 class="text-white font-semibold text-base">Flat Tire Repair</h3>
<p class="text-slate-400 text-xs mt-1 line-clamp-1">2018 Honda Civic • Grey • Lic: 8XYZ123</p>
</div>
<div class="text-right">
<span class="text-white font-bold text-sm">$45.00</span>
<p class="text-slate-500 text-[10px]">Base Fee</p>
</div>
</div>
</div>
<!-- Cancel Button -->
<button class="w-full group relative overflow-hidden bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-4 px-6 rounded-lg transition-all duration-300 border border-slate-700">
<div class="absolute inset-0 w-0 bg-red-500/10 transition-all duration-[250ms] ease-out group-hover:w-full"></div>
<div class="relative flex items-center justify-center gap-2">
<span class="material-icons text-slate-400 group-hover:text-red-400 text-xl transition-colors">close</span>
<span class="group-hover:text-white transition-colors">Cancel Request</span>
</div>
</button>
<p class="text-center text-slate-500 text-xs mt-4">
                Please stay on this screen while we connect you.
            </p>
</div>
</div>
</body></html>
