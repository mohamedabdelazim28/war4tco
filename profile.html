<!DOCTYPE html>

<html class="dark" lang="en"><head>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }

<style>

        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-100 min-h-screen flex flex-col antialiased selection:bg-primary selection:text-white">

<header class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
<div class="px-5 h-14 flex items-center justify-between">

</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 px-5 pb-24 overflow-y-auto hide-scrollbar">

<section class="py-8 flex flex-col items-center text-center">
<div class="relative group">
<div class="w-28 h-28 rounded-full p-1 bg-gradient-to-tr from-primary to-blue-400">
<img alt="Profile photo of Alex Johnson" class="w-full h-full object-cover rounded-full border-4 border-background-light dark:border-background-dark" data-alt="Young man smiling in profile picture" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDsw1BDT2JRnizlVnRFN6704uJGNrFNwS-tG64ssCan_uhunyIdXOj81EGUb8ZmncwxUX2Bneeju8RpFuPjtec7HW6Ow4ICRjMonnkA2iqUAp_byJYdHLY2bha_lPbdS33sud-fPisQZWaOIr9Gb1I3r7nmnBbuCZjnmedTkWdUg5UyP9xkF2z7HOOXvy9Y8lcFN4hhkm7yRMtE9f9p3Ny0UGRJMFjFD34RGjdnCXaKWFXJpAlgMvBXO1OxPQlI5atkJdrLVFSidEam"/>

<button class="absolute bottom-1 right-1 bg-primary text-white p-2 rounded-full shadow-lg border-2 border-background-light dark:border-background-dark">
<span class="material-icons-round text-sm block">photo_camera</span>
</button>
</div>
<div class="mt-4">
<h2 class="text-2xl font-extrabold text-slate-900 dark:text-white">Alex Johnson</h2>
<p class="text-slate-500 dark:text-slate-400 font-medium">alex.j@example.com</p>
<div class="flex items-center justify-center gap-2 mt-2">
<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-primary/10 text-primary border border-primary/20">
<span class="w-1.5 h-1.5 rounded-full bg-primary mr-1.5"></span>
                        Premium Member
                    </span>
</div>
</div>
</section>
<!-- My Garage Section -->
<section class="mb-8">
<div class="flex items-center justify-between mb-3 px-1">
<h3 class="text-lg font-bold text-slate-900 dark:text-white">My Garage</h3>
<a class="text-sm font-semibold text-primary hover:text-blue-400" href="#">Add New</a>
</div>
<!-- Vehicle Card -->
<div class="bg-white dark:bg-slate-800/50 rounded-xl overflow-hidden shadow-sm border border-slate-200 dark:border-slate-700/50 backdrop-blur-sm relative group">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-full blur-3xl -translate-y-10 translate-x-10 pointer-events-none"></div>
<div class="flex flex-row p-4 gap-4">
<!-- Car Thumbnail -->

<p class="text-sm text-slate-500 dark:text-slate-400">SE • 2021</p>
</div>
<span class="material-icons-round text-slate-400 text-xl">more_horiz</span>
</div>
<div class="mt-3 flex items-center gap-3">
<div class="bg-slate-100 dark:bg-slate-900 px-2 py-1 rounded text-xs font-mono text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700">
                                4XYZ123
                            </div>
<div class="flex items-center gap-1 text-xs text-green-500 font-medium bg-green-500/10 px-2 py-1 rounded">
<span class="material-icons-round text-[14px]">check_circle</span>
                                Verified
                            </div>
</div>
</div>
</div>
<!-- Quick Actions for Vehicle -->
<div class="px-4 py-3 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-100 dark:border-slate-700/50 flex divide-x divide-slate-200 dark:divide-slate-700">
<button class="flex-1 flex items-center justify-center gap-2 text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-primary transition-colors py-1">
<span class="material-icons-round text-lg">history</span>
                        History
                    </button>
<button class="flex-1 flex items-center justify-center gap-2 text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-primary transition-colors py-1">
<span class="material-icons-round text-lg">calendar_today</span>
                        Schedule
                    </button>
</div>
</div>
</section>
<!-- Menu Options -->
<section class="space-y-4">
<h3 class="text-lg font-bold text-slate-900 dark:text-white px-1">Account</h3>
<div class="bg-white dark:bg-slate-800/50 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700/50 backdrop-blur-sm divide-y divide-slate-100 dark:divide-slate-700/50">
<!-- Payment Methods -->
<button class="w-full flex items-center p-4 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors group">
<div class="w-10 h-10 rounded-lg bg-blue-50 dark:bg-blue-500/10 flex items-center justify-center text-primary group-hover:scale-110 transition-transform duration-200">
<span class="material-icons-round">credit_card</span>
</div>
<div class="ml-4 flex-1 text-left">
<p class="font-semibold text-slate-900 dark:text-white">Payment Methods</p>
<p class="text-xs text-slate-500 dark:text-slate-400">Visa ending in 4242</p>
</div>
<span class="material-icons-round text-slate-400 group-hover:text-primary group-hover:translate-x-1 transition-all">chevron_right</span>
</button>
<!-- Service History (Global) -->
<button class="w-full flex items-center p-4 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors group">
<div class="w-10 h-10 rounded-lg bg-orange-50 dark:bg-orange-500/10 flex items-center justify-center text-orange-500 group-hover:scale-110 transition-transform duration-200">
<span class="material-icons-round">build</span>

</div>
<span class="material-icons-round text-slate-400 group-hover:text-primary group-hover:translate-x-1 transition-all">chevron_right</span>
</button>

<div class="w-10 h-10 rounded-lg bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 group-hover:scale-110 transition-transform duration-200">
<span class="material-icons-round">settings</span>
</div>
<div class="ml-4 flex-1 text-left">
<p class="font-semibold text-slate-900 dark:text-white">Settings</p>
<p class="text-xs text-slate-500 dark:text-slate-400">Notifications, Privacy</p>
</div>
<span class="material-icons-round text-slate-400 group-hover:text-primary group-hover:translate-x-1 transition-all">chevron_right</span>
</button>
</div>
</section>
<!-- Sign Out Action -->
<div class="mt-8 mb-6">
<button class="w-full py-4 rounded-xl flex items-center justify-center gap-2 text-red-500 font-bold bg-red-50 dark:bg-red-500/10 hover:bg-red-100 dark:hover:bg-red-500/20 border border-transparent hover:border-red-200 dark:hover:border-red-500/30 transition-all">
<span class="material-icons-round">logout</span>
                Sign Out
            </button>
<p class="text-center text-xs text-slate-400 mt-4">Version 2.4.0 (Build 392)</p>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full bg-background-light/90 dark:bg-background-dark/95 border-t border-slate-200 dark:border-slate-800 backdrop-blur-lg pb-safe">

<span class="text-[10px] font-medium">Home</span>
